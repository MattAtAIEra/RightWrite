steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/rightwrite", "."]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/rightwrite"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "rightwrite"
      - "--image"
      - "gcr.io/$PROJECT_ID/rightwrite"
      - "--region"
      - "asia-east1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "1"
      - "--timeout"
      - "3600"
      - "--port"
      - "8080"
      - "--set-secrets"
      - "GEMINI_API_KEY=gemini-api-key:latest"
      # 自訂成語存在 Cloud Storage bucket 掛載的 /data，實例重啟不會消失（gen2 才支援 volume）
      - "--execution-environment"
      - "gen2"
      - "--add-volume"
      - "name=data,type=cloud-storage,bucket=rightwrite-data-teamfollowme"
      - "--add-volume-mount"
      - "volume=data,mount-path=/data"
      - "--set-env-vars"
      - "YZQJ_IDIOMS_PATH=/data/custom_idioms.json"
images:
  - "gcr.io/$PROJECT_ID/rightwrite"
